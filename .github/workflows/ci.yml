name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            compiler: g++
            build_dir: build-gcc
          - name: Clang
            compiler: clang++
            build_dir: build-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            pkg-config \
            libncurses-dev \
            libxml2-dev

      - name: Build
        env:
          CXX: ${{ matrix.compiler }}
        run: make build BUILD_DIR=${{ matrix.build_dir }}

      - name: Test
        env:
          CXX: ${{ matrix.compiler }}
        run: make test BUILD_DIR=${{ matrix.build_dir }}

      - name: Install into staging prefix
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          make install \
            BUILD_DIR=${{ matrix.build_dir }} \
            PREFIX="$RUNNER_TEMP/gpu-report-${{ matrix.name }}"
          "$RUNNER_TEMP/gpu-report-${{ matrix.name }}/bin/gpu-report" --help
          "$RUNNER_TEMP/gpu-report-${{ matrix.name }}/bin/gpu-report" --version
